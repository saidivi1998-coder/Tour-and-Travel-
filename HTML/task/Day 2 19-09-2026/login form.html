<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <table>
    <form autocomplete="off" action="" method="">
        <tr>
        <td><label for="Uname">User Name</label></td>
        <td><input type="text" id="Uname" name="username" placeholder="Enter your name" required></td>
        </tr>
        <tr>
        <td><label for="pass">Password</label></td>
        <td><input type="password" id="pass" name="password" placeholder="enter password" minlength="8" maxlength="15"></td>
        </tr>
        <tr>
        <td><label for="mail">email id</label></td>
        <td><input type="email" id="mail" name="email id" placeholder="enter mail id" required></td>
        </tr>
        <tr>
        <td><label for="rate">Rating</label></td>
        <td><input type="range" id="rate" name="Rating" value="10" min="1" max="10"></td>
        </tr>

        <tr>
        <td><button>Submit</button></td>
        <td><button>Reset</button></td>
        </tr>
    </form>
    </table>
</body>
</html>
