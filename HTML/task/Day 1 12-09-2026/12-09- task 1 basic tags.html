<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic tags</title>
</head>
<body>
    <div> //division tag
    <!-- heading tags -->
     <h1>hello World</h1>
     <h2>hello World</h2>
     <h3>hello World</h3>
     <h4>hello World</h4>
     <h5>hello World</h5>
     <h6>hello World</h6>

     <hr>
     <!-- paragraph tag -->
     <p>Lorem ipsum dolor sit amet <span style="color: blue;"> consectetur <b>adipisicing</b> elit.</span> Praesentium illo eius, minus quidem id necessitatibus culpa quaerat non optio magnam.
     </p>
     </div>
     
</body>
</html>
